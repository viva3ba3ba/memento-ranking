<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1117"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="メメモリ順位"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><title>メメモリ W177-180 統合ランキング</title><style>:root{--bg:#0e1117;--p:#171c24;--p2:#202632;--line:#303847;--txt:#f2f5f7;--muted:#9fa9b6;--a:#5aa8ff;--gm:#ffd86b;--ex:#8dc9ff;--el:#98e2a8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Yu Gothic UI",sans-serif}.wrap{max-width:1200px;margin:auto;padding:14px}h1{font-size:22px;margin:4px 0}.sub,.msg{color:var(--muted);font-size:13px}.tabs,.bar,.cards,.note{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}.tabs,.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input,select{font:inherit;min-height:44px;border:1px solid var(--line);background:var(--p2);color:var(--txt);border-radius:9px;padding:8px 10px}.tab{flex:1;font-weight:700}.active{background:#1f5a91}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{background:var(--p2);border-radius:9px;padding:9px}.card small{color:var(--muted)}.card b{display:block;font-size:18px}.tablebox{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;background:var(--p);min-width:760px}th,td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}th{position:sticky;top:0;background:#222936;text-align:left}.num{text-align:right}.gm{color:var(--gm)}.ex{color:var(--ex)}.el{color:var(--el)}.hidden{display:none}.target{background:#2d3c29}.click{cursor:pointer}dialog{width:min(760px,94vw);background:var(--p);color:var(--txt);border:1px solid var(--line);border-radius:14px}dialog::backdrop{background:#000a}@media(max-width:700px){.wrap{padding:8px 8px 70px}h1{font-size:18px}.cards{grid-template-columns:1fr 1fr}.bar{display:grid;grid-template-columns:1fr 1fr}.bar>*{width:100%}.tablebox{border:0;overflow:visible}table{min-width:0;background:transparent}thead{display:none}tbody{display:block}tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--p)}tbody td{border:0;padding:2px;white-space:normal;text-align:left!important}tbody td:nth-child(3){grid-column:1/-1;font-weight:700}.tabs{position:sticky;top:0;z-index:5}}</style></head><body><div class="wrap"><h1>メメントモリ W177–W180 統合ランキング</h1><div class="sub" id="updated">最新データを確認中…</div><div class="tabs"><button id="tg" class="tab active">🏰 ギルド戦力</button><button id="tp" class="tab">👤 個人戦力</button></div><section id="gs"><div class="bar"><input id="gq" placeholder="ギルド名検索" value="Valhalla"><select id="glim"><option value="48">TOP48</option><option value="100">TOP100</option><option value="999">すべて</option></select><button id="gr">検索</button></div><div class="cards"><div class="card"><small>取得ワールド</small><b id="gw">-</b></div><div class="card"><small>ギルド数</small><b id="gc">-</b></div><div class="card"><small>検索順位</small><b id="gRank">-</b></div><div class="card"><small>16位ボーダー</small><b id="g16">-</b></div></div><div class="tablebox"><table><thead><tr><th>#</th><th>World</th><th>ギルド</th><th class="num">戦闘力</th><th class="num">億</th><th class="num">人数</th><th>クラス</th></tr></thead><tbody id="gb"></tbody></table></div></section><section id="ps" class="hidden"><div class="bar"><select id="pw"><option value="all">W177–180 統合</option><option>177</option><option>178</option><option>179</option><option>180</option></select><input id="pq" placeholder="プレイヤー/ギルド検索"><select id="plim"><option value="100">TOP100</option><option value="200">TOP200</option><option value="9999">すべて</option></select></div><div class="cards"><div class="card"><small>プレイヤー数</small><b id="pc">-</b></div><div class="card"><small>1位戦闘力</small><b id="ptop">-</b></div><div class="card"><small>検索該当</small><b id="ph">-</b></div><div class="card"><small>表示範囲</small><b id="pscope">統合</b></div></div><div class="tablebox"><table><thead><tr><th>#</th><th>World</th><th>プレイヤー</th><th>ギルド</th><th class="num">戦闘力</th><th class="num">億</th></tr></thead><tbody id="pb"></tbody></table></div></section><div class="note"><b>自動更新：</b>GitHub Actionsで毎日データ取得を試行します。ギルドをタップすると取得済み個人ランキング内の上位10人を表示します。</div></div><dialog id="dlg"><h3 id="dt"></h3><div id="dn" class="msg"></div><div class="tablebox"><table><thead><tr><th>#</th><th>Player</th><th class="num">戦闘力</th></tr></thead><tbody id="db"></tbody></table></div><button onclick="dlg.close()">閉じる</button></dialog><script>const worlds=[1177,1178,1179,1180],S={g:[],p:[]},$=x=>document.getElementById(x),fmt=n=>Number(n||0).toLocaleString('ja-JP'),oku=n=>(n/1e8).toFixed(2)+'億',esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));function cls(r){return r<=16?['Grandmaster','gm']:r<=32?['Expert','ex']:['Elite','el']}function normG(o){let id=+o.data.WorldID[0],w=id-1000;return o.data.GuildData.map(x=>({w,n:x.GuildName,b:+x.GuildBattlePower||0,m:+x.GuildMemberCount||0}))}function normP(o){let id=+o.data.WorldID[0],w=id-1000;return o.data.PlayerData.map(x=>({w,n:x.PlayerName,g:x.GuildName||'未所属',b:+x.BattlePower||0}))}async function load(){let ok=[];for(const id of worlds){try{let [g,p]=await Promise.all([fetch(`./data/guild_${id}.json?${Date.now()}`,{cache:'no-store'}),fetch(`./data/player_${id}.json?${Date.now()}`,{cache:'no-store'})]);if(!g.ok||!p.ok)throw 0;S.g.push(...normG(await g.json()));S.p.push(...normP(await p.json()));ok.push(id-1000)}catch(e){}}S.g.sort((a,b)=>b.b-a.b);S.p.sort((a,b)=>b.b-a.b);try{let st=await fetch(`./data/status.json?${Date.now()}`,{cache:'no-store'}).then(r=>r.json());$('updated').textContent='自動更新データ: '+new Date(st.updated_at_utc).toLocaleString('ja-JP')+' / W'+ok.join(', W')}catch(e){$('updated').textContent=ok.length?'自動更新データを読込: W'+ok.join(', W'):'まだ自動取得データがありません。GitHub Actionsの初回実行を確認してください。'}renderG();renderP()}function renderG(){let q=$('gq').value.trim().toLowerCase(),ix=q?S.g.findIndex(x=>x.n.toLowerCase()===q):-1;if(ix<0&&q)ix=S.g.findIndex(x=>x.n.toLowerCase().includes(q));$('gw').textContent=[...new Set(S.g.map(x=>'W'+x.w))].join('/');$('gc').textContent=fmt(S.g.length);$('gRank').textContent=ix>=0?(ix+1)+'位':'-';$('g16').textContent=S.g[15]?oku(S.g[15].b):'-';let lim=+$('glim').value;$('gb').innerHTML=S.g.slice(0,lim).map((x,i)=>{let [c,k]=cls(i+1);return `<tr class="click${i===ix?' target':''}" data-w="${x.w}" data-n="${encodeURIComponent(x.n)}"><td>${i+1}</td><td>W${x.w}</td><td>${esc(x.n)}</td><td class="num">${fmt(x.b)}</td><td class="num">${oku(x.b)}</td><td class="num">${x.m}</td><td class="${k}">${c}</td></tr>`}).join('');document.querySelectorAll('#gb tr').forEach(tr=>tr.onclick=()=>showGuild(decodeURIComponent(tr.dataset.n),+tr.dataset.w))}function renderP(){let a=S.p,w=$('pw').value,q=$('pq').value.trim().toLowerCase();if(w!=='all')a=a.filter(x=>x.w===+w);if(q)a=a.filter(x=>x.n.toLowerCase().includes(q)||x.g.toLowerCase().includes(q));$('pc').textContent=fmt(S.p.length);$('ptop').textContent=a[0]?oku(a[0].b):'-';$('ph').textContent=fmt(a.length);$('pscope').textContent=w==='all'?'4鯖統合':'W'+w;let lim=+$('plim').value;$('pb').innerHTML=a.slice(0,lim).map((x,i)=>`<tr><td>${i+1}</td><td>W${x.w}</td><td>${esc(x.n)}</td><td>${esc(x.g)}</td><td class="num">${fmt(x.b)}</td><td class="num">${oku(x.b)}</td></tr>`).join('')}function showGuild(n,w){let a=S.p.filter(x=>x.w===w&&x.g===n).sort((a,b)=>b.b-a.b).slice(0,10);$('dt').textContent=`W${w} ${n} TOP10`; $('dn').textContent='取得済み個人ランキング内の上位者です。ギルド全員の厳密TOP10ではない場合があります。';$('db').innerHTML=a.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.n)}</td><td class="num">${fmt(x.b)} (${oku(x.b)})</td></tr>`).join('');dlg.showModal()}$('tg').onclick=()=>{$('gs').classList.remove('hidden');$('ps').classList.add('hidden');$('tg').classList.add('active');$('tp').classList.remove('active')};$('tp').onclick=()=>{$('ps').classList.remove('hidden');$('gs').classList.add('hidden');$('tp').classList.add('active');$('tg').classList.remove('active')};$('gr').onclick=renderG;$('gq').onkeydown=e=>e.key==='Enter'&&renderG();$('glim').onchange=renderG;$('pw').onchange=renderP;$('pq').oninput=renderP;$('plim').onchange=renderP;if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});load();</script></body></html>
