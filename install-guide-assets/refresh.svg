<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="t d">
<title id="t">古いアプリアイコンを更新する手順</title><desc id="d">古いアイコンを削除しウェブサイトからもう一度追加する流れ</desc>
<rect width="760" height="320" rx="26" fill="#fbf3f1"/><text x="380" y="50" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="800" fill="#2b2020">アイコンが変わらないとき</text>
