<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>みんなの編成</title><link rel="stylesheet" href="formations.css?v=32"></head><body><header><div><h1>みんなの編成</h1><p>Valhallaメンバー登録編成</p></div><div class="headButtons"><a href="./">ランキングへ戻る</a><button id="openForm">編成を登録</button></div></header><main><p id="status">読込中…</p><div id="players"></div></main><dialog id="formDialog"><form id="formationForm"><div class="dialogHead"><div><h2>編成を登録・編集</h2><p>1人につき最大15編成</p></div><button type="button" id="closeForm">閉じる</button></div><div class="formBody"><div class="basic"><label>プレイヤー名<input name="playerName" maxlength="30" required></label><label>共通キャラレベル<input name="commonLevel" type="number" min="1" max="9999" required></label><label>編成番号<select name="formationNo" required></select></label><label>編成名・用途<input name="formationName" maxlength="40" placeholder="対人用・防衛用など" required></label><label>Valhalla共通パスワード<input name="guildPassword" type="password" required></label><label>自分の編集パスワード<input name="editPassword" type="password" minlength="4" required></label></div><div id="charFields" class="charFields"></div><p id="formMessage"></p><button class="save" type="submit">この編成を保存</button></div></form></dialog><script src="formations.js?v=32"></script></body></html>
