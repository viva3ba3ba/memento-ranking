<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>みんなの編成</title><link rel="stylesheet" href="formations.css?v=49"><link rel="stylesheet" href="site-auth.css?v=49"><script src="site-auth.js?v=49" defer></script></head><body><header><div><h1>みんなの編成</h1><p>Valhallaメンバー登録編成</p></div><div class="headButtons"><a href="./">ランキングへ戻る</a><button id="openForm">編成を登録</button></div></header><main><p id="status">読込中…</p><div id="players"></div></main><dialog id="formDialog"><form id="formationForm"><div class="dialogHead"><div><h2>編成を登録・編集</h2><p>1人につき最大15編成</p></div><button type="button" id="closeForm">閉じる</button></div><div class="formBody"><div class="basic"><label>プレイヤー名<input name="playerName" maxlength="30" required></label><label>共通キャラレベル<input name="commonLevel" type="number" min="1" max="9999" required></label><label>編成番号<select name="formationNo" required></select></label><label>編成名・用途<input name="formationName" maxlength="40" placeholder="対人用・防衛用など" required></label><label>編成信頼度<select name="reliability" required><option value="1">☆1</option><option value="2">☆2</option><option value="3" selected>☆3</option><option value="4">☆4</option><option value="5">☆5</option></select></label><label class="commentField">編成コメント<textarea name="formationComment" maxlength="500" rows="4" placeholder="編成の使い方や注意点など"></textarea></label><label>Valhalla共通パスワード<input name="guildPassword" type="password" required></label><label>自分の編集パスワード<input name="editPassword" type="password" minlength="4" required></label></div><div id="charFields" class="charFields"></div><p id="formMessage"></p><button class="save" type="submit">この編成を保存</button></div></form></dialog><dialog id="renameDialog"><form id="renameForm"><div class="dialogHead"><div><h2>プレイヤー名を一括変更</h2><p>現在：<span id="renameCurrent"></span></p></div><button type="button" id="closeRename">閉じる</button></div><div class="formBody"><p>このプレイヤーが登録している全編成の名前をまとめて変更します。</p><div class="basic"><label>新しいプレイヤー名<input name="newPlayerName" maxlength="30" required></label><label>Valhalla共通パスワード<input name="guildPassword" type="password" required></label><label>自分の編集パスワード<input name="editPassword" type="password" minlength="4" required></label></div><p id="renameMessage"></p><button class="renameConfirm" type="submit">全編成のプレイヤー名を変更</button></div></form></dialog><dialog id="resetDialog"><form id="resetForm"><div class="dialogHead"><div><h2>編成を初期化</h2><p><span id="resetPlayer"></span>・編成<span id="resetNumber"></span></p></div><button type="button" id="closeReset">閉じる</button></div><div class="formBody"><p class="resetWarning">この編成の登録データを削除し、編成番号を未登録に戻します。この操作は元に戻せません。</p><div class="basic"><label>Valhalla共通パスワード<input name="guildPassword" type="password" required></label><label>自分の編集パスワード<input name="editPassword" type="password" minlength="4" required></label></div><p id="resetMessage"></p><button class="resetConfirm" type="submit">この編成を初期化</button></div></form></dialog><dialog id="deletePlayerDialog"><form id="deletePlayerForm"><div class="dialogHead"><div><h2>登録者を削除</h2><p>対象：<span id="deletePlayerName"></span></p></div><button type="button" id="closeDeletePlayer">閉じる</button></div><div class="formBody"><p class="resetWarning">この登録者と、登録済みの全編成を削除します。この操作は元に戻せません。</p><div class="basic"><label>Valhalla共通パスワード<input name="guildPassword" type="password" required></label><label>管理者専用パスワード<input name="adminPassword" type="password" required></label></div><p id="deletePlayerMessage"></p><button class="deletePlayerConfirm" type="submit">この登録者を削除</button></div></form></dialog><script src="formations.js?v=49"></script></body></html>
